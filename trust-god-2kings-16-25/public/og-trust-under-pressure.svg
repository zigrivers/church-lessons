<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Trust Under Pressure</title>
  <desc id="description">A red pressure line bends into a gold underline beneath Trust Under Pressure, a lesson based on 2 Kings 16 through 25.</desc>
  <rect width="1200" height="630" fill="#0a1423"/>
  <g opacity="0.13" stroke="#eeeadf">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/>
  </g>
  <path d="M1000 54V355C1000 436 929 482 846 482H614" fill="none" stroke="#d4523a" stroke-width="26"/>
  <path d="M614 482H1064" fill="none" stroke="#d8b45a" stroke-width="26"/>
  <text x="84" y="224" fill="#eeeadf" font-family="Arial, sans-serif" font-size="116" font-weight="800" letter-spacing="-5">TRUST</text>
  <text x="84" y="356" fill="#eeeadf" font-family="Arial, sans-serif" font-size="116" font-weight="800" letter-spacing="-5">UNDER PRESSURE</text>
  <text x="88" y="536" fill="#6ca7c8" font-family="ui-monospace, monospace" font-size="31" font-weight="700" letter-spacing="6">2 KINGS 16–25</text>
</svg>
